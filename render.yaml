databases:
  - name: cdmo-db
    plan: free
    databaseName: cdmo
    user: cdmo

services:
  # Backend API server
  - type: web
    name: cdmo-api
    runtime: node
    plan: free
    rootDir: solution-2-fullstack/server
    buildCommand: npm install && npm run build && cp -r src/db/schema.sql dist/db/
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cdmo-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://cdmo-frontend.onrender.com,https://cdmo.datastacksignal.com
      - key: PORT
        value: 3001
      - key: ANTHROPIC_API_KEY
        sync: false

staticSites:
  # React frontend
  - name: cdmo-frontend
    rootDir: solution-2-fullstack/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cdmo-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://cdmo-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
